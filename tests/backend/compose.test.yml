# Test-only override. Base file is infra/compose.yml; paths resolve from infra/.
services:
  php:
    volumes:
      - ../backend/php:/app/backend/php:ro
    environment:
      MAX_UPLOAD_BYTES: "1048576"
  mysql:
    volumes:
      - ${TEST_SCHEMA_FILE:-../tests/backend/fixtures/schema.sql}:/docker-entrypoint-initdb.d/001-test-schema.sql:ro
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-13306}:3306"
  search:
    volumes:
      - ../backend/python:/repo/backend/python:ro
      - ../tests/backend/support:/repo/tests/backend/support:ro
    build:
      context: ..
      dockerfile: tests/backend/support/Dockerfile
    command: [uvicorn, support.search:app, --host, 0.0.0.0, --port, "8000"]
    environment:
      EMBEDDING_REVISION: test-fixture-v1
  worker:
    profiles: [real-ml]
  test-runner:
    command: [python, -m, pytest, -q, tests/backend/python, tests/backend/http]
    volumes:
      - ../tests:/repo/tests:ro
      - ../backend/python:/repo/backend/python:ro
    build:
      context: ..
      dockerfile: tests/backend/support/Dockerfile
    environment:
      RUN_HTTP_TESTS: "1"
      RUN_MYSQL_TESTS: "1"
      TEST_API_URL: http://nginx
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: deeplecture_test
      DB_USER: ${DB_USER:-deeplecture}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      EMBEDDING_REVISION: test-fixture-v1
    depends_on:
      mysql:
        condition: service_healthy
      nginx:
        condition: service_started
      search:
        condition: service_started
