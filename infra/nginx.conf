resolver 127.0.0.11 valid=10s ipv6=off;
upstream php_backend {
    zone php_backend 64k;
    server php:9000 resolve;
}

server {
    listen 80;
    server_tokens off;
    client_max_body_size 501m;
    client_body_timeout 120s;
    root /app/frontend/public;

    location /api/v1/ {
        # 500 MiB file + multipart overhead; PHP validates the file itself.
        error_page 413 = @upload_too_large;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/backend/php/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 30s;
        fastcgi_pass php_backend;
    }

    location @upload_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"UPLOAD_TOO_LARGE","message":"Файл превышает лимит загрузки","details":{}},"request_id":"$request_id"}';
    }

    location ~ "^/media/videos/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\\.(mp4|webm))$" {
        alias /data/videos/$1;
        limit_except GET HEAD { deny all; }
        add_header X-Content-Type-Options nosniff always;
        types { video/mp4 mp4; video/webm webm; }
        default_type application/octet-stream;
    }

    location /media/ { return 404; }
    location / { try_files $uri $uri/ =404; }
}
