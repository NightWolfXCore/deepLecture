# Optional local single-file GGUF import, after compose.ollama.yml.
# Create storage/llm and place the model at storage/llm/Qwen3-4B-Q4_K_M.gguf first.
services:
  ollama:
    volumes:
      - type: bind
        source: ${GGUF_DIR:-../storage/llm}
        target: /imports
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./llm/Modelfile.gguf
        target: /config/Modelfile
        read_only: true
        bind:
          create_host_path: false
