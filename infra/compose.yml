name: deeplecture

x-app-env: &app-env
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: ${DB_NAME:-deeplecture}
  DB_USER: ${DB_USER:-deeplecture}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  STORAGE_ROOT: /data
  # Keep external proxies for model downloads/API calls; local service names
  # must resolve directly inside Compose even on a managed proxy host.
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},mysql,php,nginx,search,ollama
  no_proxy: ${NO_PROXY:-localhost,127.0.0.1},mysql,php,nginx,search,ollama

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-deeplecture}
      MYSQL_USER: ${DB_USER:-deeplecture}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -u"$$MYSQL_USER" -D"$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 30

  php:
    build:
      context: ..
      dockerfile: backend/php/Dockerfile
    environment:
      <<: *app-env
      PYTHON_API_URL: http://search:8000
      MAX_UPLOAD_BYTES: "524288000"
    volumes:
      - storage:/data
    depends_on:
      mysql:
        condition: service_healthy

  # Explicit one-shot production migration runner; never loads test fixtures.
  migrate:
    image: deeplecture-python:local
    profiles: [setup]
    environment:
      <<: *app-env
    volumes:
      - ../migrate.py:/app/migrate.py:ro
      - ../migrations:/app/migrations:ro
    command: [python, /app/migrate.py]
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - storage:/data:ro
      - ../index.html:/app/frontend/public/index.html:ro
      - ../css:/app/frontend/public/css:ro
      - ../js:/app/frontend/public/js:ro
      - ../assets:/app/frontend/public/assets:ro
    depends_on:
      - php

  search:
    image: deeplecture-python:local
    build:
      context: ..
      dockerfile: backend/python/Dockerfile
    environment:
      <<: *app-env
      MODEL_CACHE: /models
      MODELS_OFFLINE: ${MODELS_OFFLINE:-false}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-}
      CPU_THREADS: ${CPU_THREADS:-2}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_AUTH_MODE: ${LLM_AUTH_MODE:-bearer}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      LLM_STRUCTURED_OUTPUT: ${LLM_STRUCTURED_OUTPUT:-false}
      LLM_ALLOW_HTTP: ${LLM_ALLOW_HTTP:-false}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-90}
    volumes:
      - models:/models
    command: [uvicorn, app.api:app, --host, 0.0.0.0, --port, "8000"]
    depends_on:
      mysql:
        condition: service_healthy

  worker:
    image: deeplecture-python:local
    group_add: ["33"]
    build:
      context: ..
      dockerfile: backend/python/Dockerfile
    environment:
      <<: *app-env
      MODEL_CACHE: /models
      MODELS_OFFLINE: ${MODELS_OFFLINE:-false}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_REVISION: ${WHISPER_REVISION:-}
      MAX_IMPORT_BYTES: ${MAX_IMPORT_BYTES:-524288000}
      IMPORT_TIMEOUT: ${IMPORT_TIMEOUT:-1800}
      CPU_THREADS: ${CPU_THREADS:-2}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_AUTH_MODE: ${LLM_AUTH_MODE:-bearer}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      LLM_STRUCTURED_OUTPUT: ${LLM_STRUCTURED_OUTPUT:-false}
      LLM_ALLOW_HTTP: ${LLM_ALLOW_HTTP:-false}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-90}
    volumes:
      - storage:/data
      - models:/models
    command: [python, -m, app.worker]
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  storage:
  models:
