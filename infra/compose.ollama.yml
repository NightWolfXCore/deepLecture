# Optional local LLM. No Ollama port is published outside the Compose network.
services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.12}
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 30
  worker:
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama-models:
