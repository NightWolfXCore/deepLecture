name: Backend tests
on:
  push:
    branches: [backend]
  pull_request:
    branches: [backend]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: PHP, Python, MySQL and HTTP contract tests
        run: sh tests/backend/run.sh
